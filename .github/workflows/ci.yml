name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Node 24.14.0 bundles npm 11.9.0, but this project pins npm 11.16.0 in
      # `packageManager` and `check:env` enforces it — so without this step the
      # very first thing `npm run check` does is fail. Read the version from
      # package.json rather than repeating it here, so there is one pin, not two.
      - name: Pin npm to the version this project declares
        shell: bash
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install -g "npm@$version"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run check
